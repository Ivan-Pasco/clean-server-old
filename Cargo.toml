[package]
name = "clean-server"
version = "1.9.121"
edition = "2024"
authors = ["Ivan Pasco"]
license = "MIT OR Apache-2.0"
description = "HTTP Server Runtime for Clean Language - executes compiled WASM applications"
repository = "https://github.com/Ivan-Pasco/clean-server"
keywords = ["clean-language", "webassembly", "wasm", "server", "runtime"]
categories = ["web-programming::http-server", "wasm"]

[[bin]]
name = "clean-server"
path = "src/main.rs"

[[bin]]
name = "canary_runner"
path = "src/bin/canary_runner.rs"

[lib]
name = "clean_server"
path = "src/lib.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# WebAssembly runtime
wasmtime = "26.0"

# HTTP server
axum = { version = "0.7", features = ["json", "multipart", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "fs"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
http = "1.0"
http-body-util = "0.1"
matchit = "0.8"
parking_lot = "0.12"
dashmap = "6.0"
url = "2.5"
futures = "0.3"

# WASM binary parsing (for custom section extraction)
wasmparser = "0.218"
# Re-emit the module with snapshot exports for post-startup state restore
wasm-encoder = "0.218"

# Diagnostic reporting (RUNTIME_WASM_PARSE)
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

# Dev-mode capture: base64-encode current WASM bytes in `_dev_snapshot()` payload
base64 = "0.22"

# Email (SMTP)
lettre = { version = "0.11", features = ["smtp-transport", "native-tls", "builder"], default-features = false }

# Local dependencies
host-bridge = { path = "./host-bridge" }

# SQLite access for jobs persistence (same crate already used by host-bridge)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
reqwest = { version = "0.12", features = ["json"] }
portpicker = "0.1"
toml = "0.8"
wat = "1.243"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
